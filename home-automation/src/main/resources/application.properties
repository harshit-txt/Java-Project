server.port=8080

# ---- Database: H2 file database (works out of the box, data saved in ./data) ----
spring.datasource.url=jdbc:h2:file:./data/homeauto
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ---- To use MySQL instead: add the MySQL dependency in pom.xml, then replace the block above with ----
# spring.datasource.url=jdbc:mysql://localhost:3306/homeauto?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
