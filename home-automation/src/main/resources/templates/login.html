<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1 th:text="${siteName}">Smart Home</h1>
        <p class="sub">Log in to control your home.</p>

        <div th:replace="~{fragments :: flash}"></div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${email}" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn primary">Log in</button>
        </form>

        <div class="switch">New here? <a th:href="@{/register}">Create an account</a></div>

        <div class="demo">
            Demo accounts<br>
            Admin: admin@home.com / admin123<br>
            Homeowner: user@home.com / user123
        </div>
    </div>
</div>
</body>
</html>
